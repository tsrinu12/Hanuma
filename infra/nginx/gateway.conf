# API gateway - fronts all microservices on a single origin.
# Browser hits http://localhost:8080/<service>/... and we proxy.

server {
  listen 80;
  client_max_body_size 1024m;     # allow large video uploads

  # Default CORS for browser dev
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Methods "GET,POST,PATCH,DELETE,OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type,Authorization" always;

  location /metadata/  { proxy_pass http://metadata-service:8000/; }
  location /video/     { proxy_pass http://video-service:8000/;    proxy_request_buffering off; }
  location /ai/        { proxy_pass http://ai-service:8000/; }
  location /search/    { proxy_pass http://search-service:8000/; }
  location /recommend/ { proxy_pass http://recommendation-service:8000/; }
  location /vjepa/     { proxy_pass http://vjepa-service:8000/; }
  location /translate/ { proxy_pass http://translation-service:8000/; }
  location /spam/      { proxy_pass http://spam-service:8000/; }
  location /nlp/       { proxy_pass http://nlp-service:8000/; }
  location /points/    { proxy_pass http://gamification-service:8000/; }

  # health
  location = /healthz  { return 200 "ok\n"; add_header Content-Type text/plain; }
}
