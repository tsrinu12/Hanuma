apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: distrebute
spec:
  replicas: 2
  selector: {matchLabels: {app: ai-service}}
  template:
    metadata: {labels: {app: ai-service}}
    spec:
      serviceAccountName: distrebute-video-sa
      containers:
        - name: app
          image: ${ECR_REGISTRY}/distrebute/ai-service:${TAG}
          envFrom:
            - configMapRef: {name: distrebute-config}
            - secretRef:    {name: distrebute-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: {cpu: "500m", memory: "2Gi"}
            limits:   {cpu: "4",    memory: "6Gi"}
            # For GPU: add `nvidia.com/gpu: 1` here and use an EKS GPU node group.
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: distrebute
spec:
  selector: {app: ai-service}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service
  namespace: distrebute
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ai-service}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
