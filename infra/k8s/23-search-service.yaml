apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: distrebute
spec:
  replicas: 2
  selector: {matchLabels: {app: search-service}}
  template:
    metadata: {labels: {app: search-service}}
    spec:
      containers:
        - name: app
          image: ${ECR_REGISTRY}/distrebute/search-service:${TAG}
          envFrom:
            - configMapRef: {name: distrebute-config}
            - secretRef:    {name: distrebute-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests: {cpu: "200m", memory: "1Gi"}
            limits:   {cpu: "2",    memory: "3Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: distrebute
spec:
  selector: {app: search-service}
  ports: [{port: 8000, targetPort: 8000}]
