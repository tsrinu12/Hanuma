apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: distrebute
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start", "--optimized", "--hostname-strict=false", "--proxy=edge"]
          env:
            - {name: KEYCLOAK_ADMIN, value: admin}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: distrebute-secrets, key: POSTGRES_PASSWORD}}
            - {name: KC_DB, value: postgres}
            - name: KC_DB_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):5432/keycloak"
            - {name: KC_DB_USERNAME, value: distribute}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: distrebute-secrets, key: POSTGRES_PASSWORD}}
          envFrom:
            - configMapRef: {name: distrebute-config}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "200m", memory: "512Mi"}
            limits:   {cpu: "1",    memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: distrebute
spec:
  selector: {app: keycloak}
  ports: [{port: 8080, targetPort: 8080}]
