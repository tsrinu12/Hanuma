apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: distrebute
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: ${ECR_REGISTRY}/distrebute/frontend:${TAG}
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits:   {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: distrebute
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
