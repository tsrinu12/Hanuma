apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: distrebute
spec:
  replicas: 2
  selector: {matchLabels: {app: metadata-service}}
  template:
    metadata: {labels: {app: metadata-service}}
    spec:
      containers:
        - name: app
          image: ${ECR_REGISTRY}/distrebute/metadata-service:${TAG}
          envFrom:
            - configMapRef: {name: distrebute-config}
            - secretRef:    {name: distrebute-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits:   {cpu: "1",    memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: distrebute
spec:
  selector: {app: metadata-service}
  ports: [{port: 8000, targetPort: 8000}]
