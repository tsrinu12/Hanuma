apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-service
  namespace: distrebute
spec:
  replicas: 2
  selector: {matchLabels: {app: video-service}}
  template:
    metadata: {labels: {app: video-service}}
    spec:
      # Recommended: bind an IRSA service account with S3 PutObject + Transcribe rights.
      serviceAccountName: distrebute-video-sa
      containers:
        - name: app
          image: ${ECR_REGISTRY}/distrebute/video-service:${TAG}
          envFrom:
            - configMapRef: {name: distrebute-config}
            - secretRef:    {name: distrebute-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits:   {cpu: "2",    memory: "2Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: video-service
  namespace: distrebute
spec:
  selector: {app: video-service}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: distrebute-video-sa
  namespace: distrebute
  annotations:
    # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/distrebute-video-irsa
