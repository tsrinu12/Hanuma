apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-service
  namespace: distrebute
spec:
  replicas: 2
  selector: {matchLabels: {app: gamification-service}}
  template:
    metadata: {labels: {app: gamification-service}}
    spec:
      containers:
        - name: app
          image: ${ECR_REGISTRY}/distrebute/gamification-service:${TAG}
          envFrom:
            - configMapRef: {name: distrebute-config}
            - secretRef:    {name: distrebute-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits:   {cpu: "1",    memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-service
  namespace: distrebute
spec:
  selector: {app: gamification-service}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gamification-service
  namespace: distrebute
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gamification-service}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
