apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distrebute-qdrant
  namespace: distrebute
spec:
  serviceName: distrebute-qdrant
  replicas: 1
  selector: {matchLabels: {app: distrebute-qdrant}}
  template:
    metadata: {labels: {app: distrebute-qdrant}}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.11.0
          ports: [{containerPort: 6333}]
          volumeMounts:
            - {name: storage, mountPath: /qdrant/storage}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits:   {cpu: "2",    memory: "4Gi"}
  volumeClaimTemplates:
    - metadata: {name: storage}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
        storageClassName: gp3
---
apiVersion: v1
kind: Service
metadata:
  name: distrebute-qdrant
  namespace: distrebute
spec:
  selector: {app: distrebute-qdrant}
  ports: [{port: 6333, targetPort: 6333}]
