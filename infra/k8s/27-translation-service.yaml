apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-service
  namespace: distrebute
spec:
  replicas: 1
  selector: {matchLabels: {app: translation-service}}
  template:
    metadata: {labels: {app: translation-service}}
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: app
          image: ${ECR_REGISTRY}/distrebute/translation-service:${TAG}
          envFrom:
            - configMapRef: {name: distrebute-config}
            - secretRef:    {name: distrebute-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 240
            periodSeconds: 30
          resources:
            requests: {cpu: "1", memory: "12Gi", nvidia.com/gpu: 1}
            limits:   {cpu: "4", memory: "24Gi", nvidia.com/gpu: 1}
---
apiVersion: v1
kind: Service
metadata:
  name: translation-service
  namespace: distrebute
spec:
  selector: {app: translation-service}
  ports: [{port: 8000, targetPort: 8000}]
