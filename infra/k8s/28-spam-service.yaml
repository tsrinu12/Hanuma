apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-service
  namespace: distrebute
spec:
  replicas: 2
  selector: {matchLabels: {app: spam-service}}
  template:
    metadata: {labels: {app: spam-service}}
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: app
          image: ${ECR_REGISTRY}/distrebute/spam-service:${TAG}
          envFrom:
            - configMapRef: {name: distrebute-config}
            - secretRef:    {name: distrebute-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 90
            periodSeconds: 15
          resources:
            requests: {cpu: "500m", memory: "4Gi", nvidia.com/gpu: 1}
            limits:   {cpu: "2",    memory: "8Gi",  nvidia.com/gpu: 1}
---
apiVersion: v1
kind: Service
metadata:
  name: spam-service
  namespace: distrebute
spec:
  selector: {app: spam-service}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spam-service
  namespace: distrebute
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: spam-service}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
