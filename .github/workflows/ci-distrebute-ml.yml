name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - cold_start_bandit
          - semantic_search
          - moderation
          - live_moderation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install service deps
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        env:
          MODEL_PROFILE: lite
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/${{ matrix.service }}
        run: pytest -q --tb=short

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install all service deps + websocket client
        run: |
          python -m pip install --upgrade pip
          for svc in cold_start_bandit semantic_search moderation live_moderation; do
            pip install -r services/$svc/requirements.txt
          done
          pip install websockets

      - name: Run e2e harness
        env:
          MODEL_PROFILE: lite
        run: python scripts/e2e.py

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            scripts/e2e_report.json
            scripts/*.e2e.log

  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - cold_start_bandit
          - semantic_search
          - moderation
          - live_moderation
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            -f services/${{ matrix.service }}/Dockerfile \
            -t distrebute/${{ matrix.service }}:ci \
            .

  compose-validate:
    name: docker-compose syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f docker-compose.yml config > /dev/null
