name: distrebute
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-distribute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-distribute}
    volumes:
    - pgdata:/var/lib/postgresql/data
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-distribute}
      interval: 10s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
  qdrant:
    image: qdrant/qdrant:v1.11.0
    volumes:
    - qdrant_data:/qdrant/storage
    ports:
    - 6333:6333
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
    - miniodata:/data
    ports:
    - 9000:9000
    - 9001:9001
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/minio/health/live
      interval: 10s
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
    - ./services/auth-service/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
    - 8081:8080
  metadata-service:
    build: ./services/metadata-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 8001:8000
  video-service:
    build: ./services/video-service
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      metadata-service:
        condition: service_started
    ports:
    - 8002:8000
  ai-service:
    build: ./services/ai-service
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      metadata-service:
        condition: service_started
    ports:
    - 8003:8000
    deploy:
      resources:
        limits:
          memory: 4G
  search-service:
    build: ./services/search-service
    env_file: .env
    depends_on:
    - qdrant
    ports:
    - 8004:8000
  recommendation-service:
    build: ./services/recommendation-service
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      metadata-service:
        condition: service_started
    ports:
    - 8005:8000
  vjepa-service:
    build: ./services/vjepa-service
    env_file: .env
    depends_on:
    - qdrant
    - minio
    ports:
    - 8006:8000
    deploy:
      resources:
        limits:
          memory: 8G
  translation-service:
    build: ./services/translation-service
    env_file: .env
    ports:
    - 8007:8000
    deploy:
      resources:
        limits:
          memory: 8G
  spam-service:
    build: ./services/spam-service
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
    - 8008:8000
    deploy:
      resources:
        limits:
          memory: 8G
  nlp-service:
    build: ./services/nlp-service
    env_file: .env
    ports:
    - 8009:8000
    deploy:
      resources:
        limits:
          memory: 12G
  gamification-service:
    build: ./services/gamification-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - 8010:8000
  gateway:
    image: nginx:1.27-alpine
    volumes:
    - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - 8080:80
    depends_on:
    - metadata-service
    - video-service
    - ai-service
    - search-service
    - recommendation-service
    - vjepa-service
    - translation-service
    - spam-service
    - nlp-service
    - gamification-service
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8080
    ports:
    - 3000:80
    depends_on:
    - gateway
  cold_start_bandit:
    build:
      context: .
      dockerfile: services/cold_start_bandit/Dockerfile
    image: distrebute/cold-start-bandit:latest
    container_name: distrebute_cold_start_bandit
    environment:
      MODEL_PROFILE: ${MODEL_PROFILE:-lite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: cold_start_bandit
      PYTHONUNBUFFERED: '1'
    ports:
    - 8011:8001
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/health')
      interval: 30s
      timeout: 5s
      retries: 3
  semantic_search:
    build:
      context: .
      dockerfile: services/semantic_search/Dockerfile
    image: distrebute/semantic-search:latest
    container_name: distrebute_semantic_search
    environment:
      MODEL_PROFILE: ${MODEL_PROFILE:-lite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: semantic_search
      PYTHONUNBUFFERED: '1'
    ports:
    - 8012:8002
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8002/health')
      interval: 30s
      timeout: 5s
      retries: 3
  moderation:
    build:
      context: .
      dockerfile: services/moderation/Dockerfile
    image: distrebute/moderation:latest
    container_name: distrebute_moderation
    environment:
      MODEL_PROFILE: ${MODEL_PROFILE:-lite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: moderation
      PYTHONUNBUFFERED: '1'
    ports:
    - 8013:8003
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8003/health')
      interval: 30s
      timeout: 5s
      retries: 3
  live_moderation:
    build:
      context: .
      dockerfile: services/live_moderation/Dockerfile
    image: distrebute/live-moderation:latest
    container_name: distrebute_live_moderation
    environment:
      MODEL_PROFILE: ${MODEL_PROFILE:-lite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: live_moderation
      PYTHONUNBUFFERED: '1'
    ports:
    - 8014:8004
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8004/health')
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pgdata: null
  miniodata: null
  qdrant_data: null
